<!doctype html>
<html lang="zh-CN">
  <head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7KKTDMSHKF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7KKTDMSHKF');
  </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Citrus 柑橘味作品集，收集摄影、插图与温暖文字。"
    />
    <title>Citrus 柑橘作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+JP:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="museum-notice" role="note">
      🍊 免费浏览与下载 · 仅供个人收藏与交流使用 · 请支持正版作品 · 禁止商业用途及二次售卖
    </div>

    <section class="site-hero" aria-labelledby="site-title">
      <header class="site-header">
        <a class="account-badge" href="index.html" aria-label="回到 Meteor宇_ 的 Citrus 首页">
          <img src="images/avatar-meteor.jpg" alt="" />
          <span>
            <strong>Meteor宇_</strong>
            <small>@meteoryu619</small>
          </span>
        </a>
      </header>

      <div class="hero-copy">
        <h1 id="site-title">Citrus</h1>
        <p class="hero-text">柚子と芽衣は永遠に幸せに一緒にいます</p>
      </div>
    </section>

    <main class="page-shell">
      <section class="category-section" aria-labelledby="category-title">
        <h2 id="category-title" class="sr-only">图集分类</h2>
        <div class="category-tabs" id="categoryTabs" aria-label="一级分类"></div>
        <div class="subtag-tabs" id="subtagTabs" aria-label="二级标签"></div>
      </section>

      <section aria-labelledby="gallery-title">
        <div class="gallery-heading">
          <div class="gallery-title-block">
            <h2 id="gallery-title">柑橘图集</h2>
            <p>CITRUS GALLERY</p>
            <small id="galleryMode">精选图集 · 最新更新 · 推荐收藏</small>
          </div>
          <p class="result-count" id="resultCount" aria-live="polite"></p>
        </div>

        <div class="collection-grid" id="gallery" aria-live="polite"></div>
        <p class="empty-state" id="emptyState" hidden>这个分类下暂时没有图集。</p>
      </section>
    </main>

    <div class="collection-modal" id="collectionModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-collection></div>
      <section
        class="collection-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="collectionTitle"
      >
        <button class="icon-button close-button" type="button" data-close-collection aria-label="关闭">
          ×
        </button>

        <header class="collection-header">
          <img src="images/avatar-meteor.jpg" alt="" />
          <div>
            <p class="section-kicker" id="collectionMeta"></p>
            <h2 id="collectionTitle"></h2>
            <p id="collectionDescription"></p>
            <div class="modal-tags" id="collectionTags"></div>
          </div>
        </header>

        <div class="collection-images" id="collectionImages"></div>
        <p class="download-hint">请长按图片保存，打包下载功能后续开放。</p>
      </section>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-close-lightbox></div>
      <section
        class="lightbox-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightboxTitle"
      >
        <button class="icon-button close-button" type="button" data-close-lightbox aria-label="关闭">
          ×
        </button>

        <button class="arrow-button prev-button" type="button" id="prevWork" aria-label="上一张">
          ‹
        </button>
        <button class="arrow-button next-button" type="button" id="nextWork" aria-label="下一张">
          ›
        </button>

        <div class="lightbox-media">
          <img id="lightboxImage" src="" alt="" />
        </div>

        <article class="lightbox-content">
          <p class="section-kicker" id="lightboxDate"></p>
          <h2 id="lightboxTitle"></h2>
          <p id="lightboxDescription"></p>
          <div class="lightbox-tags" id="lightboxTags"></div>
          <div class="download-actions">
            <button class="download-button" type="button" id="downloadSingle">下载单张</button>
            <button class="download-button primary" type="button" disabled>下载全部后续开放</button>
          </div>
        </article>
      </section>
    </div>

    <script src="main.js"></script>
  </body>
</html>
